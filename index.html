<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Joseph's Recipe Book</title>
    <meta name="description" content="Joseph's baking recipes in a book you flip through: cups and spoons first, grams beside, a printable sheet for every recipe." />
    <meta name="theme-color" content="#fff4df" />
    <!-- The saved colourway, before first paint (src/theme.js keeps it in step). -->
    <script>
      try {
        var grounds = { blueplate: '#fbf4e4', soda: '#fdf5e6', butterscotch: '#fff2e0' };
        var saved = localStorage.getItem('recipe-book:theme');
        if (grounds[saved]) {
          document.documentElement.setAttribute('data-theme', saved);
          document.querySelector('meta[name="theme-color"]').setAttribute('content', grounds[saved]);
        }
      } catch (e) {}
    </script>
    <meta property="og:title" content="Joseph's Recipe Book" />
    <meta property="og:description" content="Joseph's baking recipes, cups and spoons first." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <!-- The two display faces paint the first screen: fetch them with the HTML. -->
    <link rel="preload" href="/assets/fonts/Shrikhand-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/LilitaOne-Regular.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
